<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-color">
	<main class="error-page" role="main">
		<figure class="sadmac-figure" aria-labelledby="error-title error-message">
			<h1 id="error-title" class="page-title">404</h1>
			<div class="emoji-form" id="emojiForm">
				<div class="emoji-row">
					<input id="emojiInput" class="emoji-input" type="text" inputmode="text" aria-label="Emoji input" aria-describedby="emojiStatus">
					<button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch to monochrome theme">Monochrome</button>
				</div>
				<p class="emoji-status" id="emojiStatus" aria-live="polite"></p>
			</div>
			<div class="sad-mac" id="sadMac" aria-hidden="true">
				<div class="sad-face is-blank" id="sadFace">
					<span class="face-brow face-brow-left"></span>
					<span class="face-brow face-brow-right"></span>
					<span class="face-eye face-eye-left"></span>
					<span class="face-eye face-eye-right"></span>
					<span class="face-cheek face-cheek-left"></span>
					<span class="face-cheek face-cheek-right"></span>
					<span class="face-sweat"></span>
					<span class="face-stars"></span>
					<span class="face-mouth"></span>
					<span class="face-mark"></span>
				</div>
				<span class="facebox-bottom"></span>
			</div>
			<figcaption class="pixel-caption" id="error-message">
				<span class="sr-text">Error 404: Not Found</span>
				<span class="e"></span>
				<span class="r"></span>
				<span class="r"></span>
				<span class="o"></span>
				<span class="r"></span>
				<span class="_4"></span>
				<span class="_0"></span>
				<span class="_4"></span>
				<span class="n"></span>
				<span class="o"></span>
				<span class="t"></span>
				<span class="f"></span>
				<span class="o"></span>
				<span class="u"></span>
				<span class="n"></span>
				<span class="d"></span>
			</figcaption>
			<p class="subtext">The page you requested does not exist.</p>
		</figure>
	</main>
	<script src="script.js"></script>
</body>
</html>
