<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Sad Mac favicon</title>
  <desc id="desc">Classic pixel-art Sad Mac face used as website favicon.</desc>
  <rect width="64" height="64" fill="#0f0f0f"/>

  <!-- Macintosh body -->
  <rect x="10" y="6" width="44" height="52" fill="#ffffff"/>
  <rect x="8" y="4" width="48" height="56" fill="none" stroke="#000000" stroke-width="4"/>

  <!-- Screen bezel -->
  <rect x="18" y="14" width="28" height="24" fill="#ffffff"/>
  <rect x="16" y="12" width="32" height="28" fill="none" stroke="#000000" stroke-width="4"/>

  <!-- Sad face -->
  <rect x="24" y="20" width="4" height="4" fill="#000000"/>
  <rect x="36" y="20" width="4" height="4" fill="#000000"/>
  <rect x="24" y="30" width="4" height="2" fill="#000000"/>
  <rect x="28" y="28" width="8" height="2" fill="#000000"/>
  <rect x="36" y="30" width="4" height="2" fill="#000000"/>

  <!-- Floppy slot + feet line -->
  <rect x="22" y="46" width="20" height="4" fill="#000000"/>
  <rect x="14" y="58" width="36" height="2" fill="#000000"/>
</svg>
