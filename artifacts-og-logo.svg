<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">hogjamaus.fyi BoaaadD logo</title>
  <desc id="desc">Square social and structured-data logo based on the current BoaaadD emblem.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111933" />
      <stop offset="100%" stop-color="#243c86" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="36%" r="60%">
      <stop offset="0%" stop-color="#ffd04f" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#ffd04f" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#05070d" flood-opacity="0.34" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="84" fill="url(#bg)" />
  <circle cx="256" cy="172" r="184" fill="url(#glow)" />
  <g filter="url(#shadow)">
    <rect x="52" y="52" width="408" height="408" rx="58" fill="#0c1018" stroke="#f3c23b" stroke-width="3" />
    <image href="BoaaadD.png" x="84" y="84" width="344" height="344" preserveAspectRatio="xMidYMid meet" />
  </g>
</svg>
